[build]
  command = "npm run build"
  publish = ".next"
  ignore = "/bin/false"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# www -> apex, per domene (Lars 21.09.2026).
#
# Netlifys egen «Primary domain»-redirect kan IKKE brukes her: Primary er
# centerforge.norditech.io, og den ville sendt alle tenantene dit. Én site
# betjener hele huset, så www-opprydding må gjøres per domene.
#
# force = true er noedvendig: uten den slaar regelen bare til naar ingenting
# annet matcher, og Next.js fanger alt.
#
# ⚠️ ROTA («/») TAS IKKE HER, MEN I proxy.ts. Omskrivingen «/» -> «/twinledger»
# kjoerer FOER Netlifys redirect-motor, saa denne regelen ville sendt brukeren
# til https://twinledger.ai/twinledger — en intern sti ingen skal se. Endrer du
# den ene, se paa den andre.
#
# Canonical peker uansett paa apex, saa dette er opprydding og ikke en
# soekefiks -- men en bruker som deler en www-lenke skal ikke etterlate en
# annen adresse enn den vi selv oppgir.
#
# ⚠️ Legger du til et nytt .ai-domene med www: legg til en blokk her ogsaa.
#
# FORSKJELLEN MELLOM DE TO: twinledger.ai skrives om paa «/» (proxy.ts), og
# derfor maa ROTA redirectes der -- se merknaden over. voicebank.ai skrives
# IKKE om, saa «/» passerer uroert gjennom proxy.ts og fanges av regelen her.
# Derfor trenger voicebank bare en blokk, mens twinledger trenger begge deler.

[[redirects]]
  from = "https://www.twinledger.ai/*"
  to = "https://twinledger.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.voicebank.ai/*"
  to = "https://voicebank.ai/:splat"
  status = 301
  force = true

# «Stemmebank» er ETT ord naar man sier det, og ruta heter voice-bank. Lars
# skrev /dashboard/voicebank og fikk 404 paa en side han hadde faatt lenke
# til. Skrivefeilen er ikke hans -- den ligger i at adressen ikke likner
# navnet. Dette gjelder alle tenantene, siden dashbordet er delt.
#
# 302, ikke 301: den riktige adressen er voice-bank, og en permanent
# omdirigering ville laast feilstavingen inn i nettleserhistorikken som om den
# var et alternativt navn.
[[redirects]]
  from = "/dashboard/voicebank"
  to = "/dashboard/voice-bank"
  status = 302

[[redirects]]
  from = "/dashboard/voicebank/*"
  to = "/dashboard/voice-bank/:splat"
  status = 302
