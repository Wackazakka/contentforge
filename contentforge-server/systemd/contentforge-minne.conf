# /etc/systemd/system/contentforge.service.d/minne.conf (lagt inn 10.11.2026)
# Ikke del av deploy-contentforge.sh — ligger her som dokumentasjon.
# Amys egne videoklipp (8.11) fikk hele dropleten tom for minne. Taket holder
# videotjenesten unna minnet AlgoMaster trenger, og OOMPolicy=continue gjoer
# at en drept ffmpeg ikke tar ned hele tjenesten.
[Service]
MemoryHigh=4G
MemoryMax=5G
OOMPolicy=continue
