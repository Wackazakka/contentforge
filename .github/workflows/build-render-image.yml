name: Bygg fjern-render-image

# Skalering steg 3 (Lars 11/8): bygg render-containeren i CI og push til GHCR,
# saa den bor i et register — ikke paa dropletens trange disk — og kan hentes av
# ekstern compute (Cloud Run / Fargate / Modal). Bygger KUN naar render-stien
# endrer seg, pluss manuelt via "Run workflow".
on:
  push:
    branches: [main]
    paths:
      - contentforge-server/Dockerfile.render-remote
      - contentforge-server/make_tiktok_reforhandle.py
      - contentforge-server/render_remote.py
      - .github/workflows/build-render-image.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cf-render-remote

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # noedvendig for aa pushe til GHCR med GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - name: Logg inn i GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR krever smaa bokstaver i eiernavnet.
      - name: Utled image-navn (lowercase)
        id: navn
        run: echo "image=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Bygg og push
        uses: docker/build-push-action@v6
        with:
          context: contentforge-server
          file: contentforge-server/Dockerfile.render-remote
          push: true
          tags: |
            ${{ steps.navn.outputs.image }}:latest
            ${{ steps.navn.outputs.image }}:${{ github.sha }}
